services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mosip-resource-calculator-backend:16-03-2026
    container_name: mosip-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/config')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mosip-resource-calculator-frontend:16-03-2026
    container_name: mosip-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
